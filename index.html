<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/vistorias/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Sistema de vistorias imobiliárias">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Space Imobi Vistorias">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Space Imobi Vistorias</title>
  <link rel="manifest" href="manifest.json">

  <!-- Preload de assets críticos -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  
  <script>
    // Detecta se está em produção e ajusta o base path
    window.flutterBasePath = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') 
      ? '/' 
      : '/vistorias/';
    
    // The value below is injected by flutter build, do not touch.
    const serviceWorkerVersion = "802910717";
    var scriptLoaded = false;
    function loadMainDartJs() {
      if (scriptLoaded) {
        return;
      }
      scriptLoaded = true;
      var scriptTag = document.createElement('script');
      scriptTag.src = 'main.dart.js';
      scriptTag.type = 'application/javascript';
      document.body.append(scriptTag);
    }

    // Carrega o flutter.js com o caminho correto
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        var baseHref = window.flutterBasePath;
        var scriptTag = document.createElement('script');
        scriptTag.src = baseHref + 'flutter.js';
        scriptTag.defer = true;
        document.body.appendChild(scriptTag);
      });
    }

    // Adicionar fallback para base href
    document.querySelector('base').href = 
      window.location.pathname.startsWith('/vistorias') 
        ? '/vistorias/' 
        : '/';
  </script>

  <!-- Carregamento do Flutter -->
  <script src="/vistorias/flutter.js" defer></script>

  <style>
    /* Fallback enquanto a fonte carrega */
    .material-icons {
      font-family: 'Material Icons';
      font-weight: normal;
      font-style: normal;
      font-size: 24px;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none;
      display: inline-block;
      white-space: nowrap;
      word-wrap: normal;
      direction: ltr;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      -moz-osx-font-smoothing: grayscale;
      font-feature-settings: 'liga';
    }

    /* Estilo para tela de carregamento */
    .loading {
      position: fixed;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background-color: #2f503d;
      color: white;
      font-family: 'Roboto', sans-serif;
    }

    .loading img {
      width: 100px;
      height: 100px;
      margin-bottom: 20px;
    }

    .loading p {
      margin-top: 16px;
      font-size: 16px;
    }

    .loading-error {
      color: #ff6b6b;
      text-align: center;
      max-width: 80%;
      padding: 20px;
      background: rgba(255,255,255,0.1);
      border-radius: 8px;
    }

    .loading-error button {
      margin-top: 16px;
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      background: #ff6b6b;
      color: white;
      cursor: pointer;
    }

    .loading-error pre {
      max-width: 100%;
      overflow-x: auto;
      background: rgba(0,0,0,0.2);
      padding: 8px;
      border-radius: 4px;
      font-size: 12px;
    }
  </style>

  <!-- Adicionar após as meta tags existentes -->
  <meta name="theme-color" content="#2f503d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- Adicionar preload do flutter.js -->
  <link rel="preload" href="/flutter.js" as="script">
</head>
<body>
  <div class="loading">
    <img src="icons/Icon-192.png" alt="Loading">
    <p>Carregando...</p>
  </div>

  <script>
    window.addEventListener('load', function(ev) {
      var loading = document.querySelector('.loading');
      var loadingText = loading.querySelector('p');
      
      // Download main.dart.js
      if (!_flutter) {
        loadingText.textContent = 'Erro: Flutter não encontrado';
        return;
      }

      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: async function(engineInitializer) {
          loadingText.textContent = 'Inicializando...';
          let appRunner = await engineInitializer.initializeEngine({
            useColorEmoji: true,
            renderer: "canvaskit"
          });

          loadingText.textContent = 'Iniciando aplicativo...';
          await appRunner.runApp();
        }
      });
    });
  </script>
</body>
</html>
